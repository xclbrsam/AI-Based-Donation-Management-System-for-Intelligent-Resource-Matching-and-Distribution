<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    {% load static %}

    <link rel="stylesheet" href="{% static 'css/login.css' %}">

</head>

<body>

<div class="container">

    <div class="card">

        <h2>Login</h2>

        <form id="loginForm">

            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">

                Login

            </button>

        </form>

        <p id="message"></p>

        <br>

        <a href="/">Create New Account</a>

    </div>

</div>

<script src="{% static 'js/login.js' %}"></script>

</body>

</html>
